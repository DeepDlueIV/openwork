name: NoClip Windows test build
run-name: NoClip Windows preview - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [noclip, noclip-install-isolation, noclip-fix-appdata]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'ee/**'
      - 'scripts/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'constants.json'
      - '.github/workflows/noclip-windows-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noclip-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: github.repository == 'DeepDlueIV/openwork' && (github.ref == 'refs/heads/noclip' || github.ref == 'refs/heads/noclip-install-isolation' || github.ref == 'refs/heads/noclip-fix-appdata')
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OPENWORK_DESKTOP_SENTRY_DSN: ''
      TEST_APP_VERSION: 0.18.58-noclip.${{ github.run_number }}.${{ github.run_attempt }}
      UPGRADE_FROM_VERSION: 0.18.58-noclip.0.0

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.4.0'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Check NoClip isolation and cold appData initialization
        run: node --test --test-reporter=tap apps/desktop/test/noclip-isolation.test.mjs apps/desktop/test/noclip-appdata.test.mjs

      - name: Test asynchronous uninstaller completion checks
        run: ./apps/desktop/test/noclip-wait-removal.test.ps1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer, server, runtime and pinned OpenCode sidecars
        run: pnpm --filter @openwork/desktop run build:electron

      - name: Run desktop session-runner tests
        timeout-minutes: 3
        working-directory: apps/desktop
        run: >-
          node --test --test-reporter=tap --test-timeout=60000
          ./test/session-runner.test.mjs ./test/session-journal-rename.test.mjs

      # Same source, lower version: tests installer upgrades, NOT DB migrations.
      # This fixture is never uploaded or published.
      - name: Package older-version upgrade fixture
        run: >-
          pnpm --dir apps/desktop exec electron-builder
          --config electron-builder.noclip.yml --win nsis --x64 --publish never
          --config.directories.output=dist-electron-upgrade-from
          "--config.extraMetadata.version=$env:UPGRADE_FROM_VERSION"

      - name: Package unsigned isolated NoClip Windows x64 installer
        run: >-
          pnpm --dir apps/desktop exec electron-builder
          --config electron-builder.noclip.yml --win nsis --x64 --publish never
          "--config.extraMetadata.version=$env:TEST_APP_VERSION"

      - name: Verify identity and updater in the packaged application
        run: node apps/desktop/scripts/verify-noclip-package.mjs

      - name: Verify packaged GUI first startup and restart on disposable Windows
        timeout-minutes: 5
        run: node apps/desktop/scripts/noclip-packaged-startup-smoke.mjs

      - name: Preserve packaged GUI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: noclip-gui-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noclip-packaged-gui/*
          if-no-files-found: warn
          retention-days: 7

      - name: Verify upgrade, uninstall and reinstall preserve user data
        timeout-minutes: 20
        run: ./apps/desktop/scripts/noclip-install-smoke.ps1

      - name: Verify installer and record provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'apps/desktop/dist-electron'
          $installers = @(Get-ChildItem -LiteralPath $output -Filter 'noclip-win-x64-*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NoClip installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw 'Installer is unexpectedly small.' }
          Copy-Item -LiteralPath $installer.FullName -Destination "$output/NoClip-Setup-x64.exe"
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'noclip-packaged-gui/GUI-SMOKE.json') -Destination "$output/GUI-SMOKE.json"
          $gui = Get-Content "$output/GUI-SMOKE.json" -Raw | ConvertFrom-Json
          if ($gui.ok -ne $true) { throw 'Packaged GUI startup evidence is not successful.' }
          $hash = (Get-FileHash -LiteralPath "$output/NoClip-Setup-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NoClip-Setup-x64.exe" | Set-Content -LiteralPath "$output/SHA256SUMS.txt" -Encoding utf8
          @(
            "Repository: $env:SOURCE_REPOSITORY"
            "Commit: $env:SOURCE_COMMIT"
            "Branch: $env:SOURCE_BRANCH"
            'Upstream baseline: OpenWork v0.18.58 (258218b9b69c91e3d5020488fe1d14ff767679e9)'
            "Package version: $env:TEST_APP_VERSION"
            'Application: NoClip; appId: io.github.deepdlueiv.noclip; protocol: noclip'
            'Profile: .noclip inside the OS account home; original OpenWork profiles are not imported.'
            'Manual upgrade: close NoClip and run the new installer; no prior uninstall needed.'
            'Normal uninstall preserves the profile, including settings, history and credentials.'
            'Upstream auto-updates and recovery downloads remain disabled.'
            'Windows x64 unsigned diagnostic build; not a security-cleared public release.'
            'CI checked packaged GUI first startup and restart; see GUI-SMOKE.json.'
            'CI checked version upgrade, uninstall and reinstall against profile/OpenWork fixtures.'
            'Upgrade fixture uses the same source with an older package version; DB migrations are not tested.'
            'Shluz integration and other operating-system installers are not verified.'
            'The earlier browser malware warning is unresolved; functional checks are not malware certification.'
          ) | Set-Content -LiteralPath "$output/BUILD-INFO.txt" -Encoding utf8
          @(
            '## NoClip Windows x64 diagnostic build'
            "Source commit: $env:SOURCE_COMMIT"
            "Version: $env:TEST_APP_VERSION"
            'Installer: NoClip-Setup-x64.exe'
            "SHA256: $hash"
            'Packaged GUI startup/restart, upgrade, reinstall and data-preserving uninstall checks passed.'
            'Release publication remains gated separately from functional build checks.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload diagnostic installer and verification information
        uses: actions/upload-artifact@v4
        with:
          name: noclip-isolated-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/desktop/dist-electron/NoClip-Setup-x64.exe
            apps/desktop/dist-electron/SHA256SUMS.txt
            apps/desktop/dist-electron/BUILD-INFO.txt
            apps/desktop/dist-electron/INSTALL-SMOKE.json
            apps/desktop/dist-electron/GUI-SMOKE.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-preview:
    needs: windows-x64
    # Never publish a diagnostic feature branch or infer security approval from functional tests.
    if: github.repository == 'DeepDlueIV/openwork' && vars.NOCLIP_RELEASE_APPROVED == 'true' && (github.ref == 'refs/heads/noclip' || github.ref == 'refs/heads/noclip-install-isolation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download only this run's verified artifact
        uses: actions/download-artifact@v4
        with:
          name: noclip-isolated-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-files
      - name: Verify checksums and publish an experimental release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: 0.18.58-noclip.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('INSTALL-SMOKE.json').read_text(encoding='utf-8-sig'))
          for field in ('ok', 'inPlaceUpgrade', 'sameRegistryIdentity', 'reinstall', 'uninstalled'):
              assert evidence.get(field) is True, f'Missing successful check: {field}'
          assert evidence['upgradeTo'] == os.environ['VERSION']
          assert evidence['profileFixturesPreserved'] == 4
          assert evidence['originalFixturesPreserved'] == 5
          assert json.loads(Path('GUI-SMOKE.json').read_text(encoding='utf-8-sig'))['ok'] is True
          assert f"Commit: {os.environ['SOURCE_SHA']}" in Path('BUILD-INFO.txt').read_text(encoding='utf-8-sig')
          PY
          tag="noclip-v${VERSION}"
          cat > RELEASE-NOTES.md <<NOTES
          ## Windows x64 diagnostic preview
          [NoClip-Setup-x64.exe](https://github.com/${GH_REPO}/releases/download/${tag}/NoClip-Setup-x64.exe)
          Source: ${SOURCE_SHA}. Close NoClip and run an approved newer installer over the existing version; no prior uninstall needed. The separate .noclip profile is retained.
          Packaged GUI startup/restart and installer lifecycle checks passed. Shluz and database migrations are not verified. This is unsigned experimental software. Do not disable Windows security protections.
          NOTES
          gh release create "$tag" NoClip-Setup-x64.exe SHA256SUMS.txt BUILD-INFO.txt INSTALL-SMOKE.json GUI-SMOKE.json \
            --target "$SOURCE_SHA" --title "NoClip ${VERSION} — Windows x64 preview" \
            --notes-file RELEASE-NOTES.md --draft --prerelease --latest=false
          gh release edit "$tag" --draft=false --prerelease --latest=false
          echo "[Release](https://github.com/${GH_REPO}/releases/tag/${tag})" >> "$GITHUB_STEP_SUMMARY"
